# Spec Workflow MCP Server Configuration File
# ============================================
#
# Copy this file to `config.toml` in the same directory to customize the Spec Workflow server.
# Configuration priority (highest to lowest): command line args > config file > built-in defaults.
#
# All settings are optional. Uncomment to override defaults. Ensure MCP client supports local config loading.

# Project directory path
# The root directory containing your spec documents and source code.
# Use double backslashes on Windows when providing absolute paths.
# Supports tilde (~) expansion for the home directory.
# Default: current working directory
# projectDir = "."
# projectDir = "~/projects/tcwyirs-ui"
# projectDir = "C:\\Users\\admin\\Company\\code\\tcwyirs-ui"

# Dashboard port
# Port for the web dashboard. Must be between 1024 and 65535.
# Default: ephemeral port assigned automatically
# port = 3480

# Auto-start dashboard
# Launch the dashboard in the default browser when the server starts.
# Default: false
# autoStartDashboard = true

# Dashboard-only mode
# Run only the dashboard (no MCP server). Useful for read-only reviews.
# Default: false
# dashboardOnly = false

# Language
# Interface language for internationalized dashboards.
# Default: system language or "en"
# lang = "zh-CN"

# =====================================================================
# Recommended baseline for the tcwyirs-ui repository
# =====================================================================

# Ready-to-run defaults for local development. Adjust values as needed.
projectDir = "./"
port = 3456
autoStartDashboard = true
dashboardOnly = false
lang = "zh-CN"
